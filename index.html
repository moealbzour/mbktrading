<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#06080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MBK Trading" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/mbk-logo.png?v=8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8" />
    <title>MBK Trading</title>
    <meta name="description" content="MBK Trading — توصيات، بوت MBK، الشات العام، وأخبار الأسواق." />
    <meta property="og:title" content="MBK Trading" />
    <meta property="og:description" content="MBK Trading — توصيات، بوت MBK، الشات العام، وأخبار الأسواق." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          // 1. Synchronous pre-paint theme application (zero FOUC)
          var savedTheme = localStorage.getItem('mbk_theme_mode_v2');
          var resolved = 'dark';
          if (savedTheme === 'light') {
            resolved = 'light';
          } else if (savedTheme === 'auto') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', resolved);
          root.setAttribute('data-theme-mode', savedTheme || 'dark');
          root.style.colorScheme = resolved;
          if (resolved === 'light') {
            root.classList.add('theme-light');
            root.classList.remove('dark', 'theme-dark');
          } else {
            root.classList.add('dark', 'theme-dark');
            root.classList.remove('theme-light');
          }
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute('content', resolved === 'light' ? '#F0F3FA' : '#06080c');
          }

          // 2. Build version cache housekeeping
          var BUILD_VER = 'mbk-2026-11-18-v8';
          var prev = localStorage.getItem('mbk_app_build_ver');
          if (prev !== BUILD_VER) {
            localStorage.setItem('mbk_app_build_ver', BUILD_VER);
            // Reset any hidden/folded panel flags on laptop so all new tabs and panels are immediately visible
            localStorage.setItem('mbk_tv_nav_rail_folded', 'false');
            localStorage.setItem('mbk_tv_sidebar_shrinked', 'false');
            localStorage.setItem('mbk_tv_bottom_panel_folded', 'false');
            if (localStorage.getItem('mbk_tv_chat_dock_position') === 'hide') {
              localStorage.setItem('mbk_tv_chat_dock_position', 'left');
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.update(); });
              });
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#1E53E5]/15 dark:selection:bg-[#10b981]/30 selection:text-[#131722] dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
